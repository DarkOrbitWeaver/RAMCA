name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LocalIdeBridge.sln
      - name: Build
        run: dotnet build LocalIdeBridge.sln -c Release --no-restore
      - name: Test
        run: dotnet test LocalIdeBridge.sln -c Release --no-build --logger trx
